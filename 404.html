<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · 皮蛋瘦肉舟</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#fcfbf8; --text:#1e1d1b; --muted:#9c968d; --accent:#8c3a3a; --border:#e5e2db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --text:#dedad3; --muted:#a09b93; --accent:#cb8f8f; --border:#2e2e2b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.75; padding: 24px;
  }
  .box { max-width: 460px; text-align: center; }
  .code {
    font-family: "Songti SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    font-size: 4.5rem; font-weight: 600; letter-spacing: 0.06em;
    color: var(--accent); line-height: 1; margin-bottom: 18px;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
  a {
    display: inline-block; padding: 10px 24px;
    border: 1px solid var(--accent); border-radius: 3px;
    color: var(--accent); text-decoration: none; font-size: 0.94rem;
    transition: background-color .2s, color .2s;
  }
  a:hover { background: var(--accent); color: var(--bg); }
  .hr { width: 46px; height: 2px; background: var(--border); margin: 0 auto 26px; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="hr"></div>
    <h1>这里没有你要找的东西</h1>
    <p>链接可能已经失效，或者你打错了一个字。<br>不如回到首页，随便读一篇。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
